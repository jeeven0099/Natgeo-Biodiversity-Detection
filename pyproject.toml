[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "biodetect"
version = "0.1.0"
description = "Unsupervised detection and clustering of animal sounds in soundscape recordings (Guerrero et al. 2023 pipeline)"
readme = "BIODETECT.md"
requires-python = ">=3.10"
authors = [{ name = "jeeven0099" }]
keywords = ["bioacoustics", "passive acoustic monitoring", "segmentation", "clustering", "LAMDA", "Otsu"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "soundfile>=0.12",
    "numba>=0.58",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
viewer = ["ipywidgets>=8", "ipython>=8", "jupyter"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
biodetect = "biodetect.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
# The capstone research scripts and their notebook are not held to the package lint rules.
extend-exclude = ["scripts", "jobs", "notebooks/perch_zeroshot_viewer.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741"]
